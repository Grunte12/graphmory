<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Graphmory MCP and shared engine</title>
<desc id="desc">Claude Code, Codex, Cursor and OpenCode call recall, read and remember through MCP. MCP and CLI share the engine. Keyword and local meaning seeds follow bounded links, filter lifecycle, fuse with RRF, then optionally rerank. The Curator selects and verifies originals. Guarded writes finish with receipts in canonical Markdown.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
<style>text{font-family:system-ui,sans-serif;fill:#2d3142}.title{font-size:30px}.label{font-size:18px;font-weight:600}.small{font-size:14px;fill:#4f5d75}.mono{font-family:ui-monospace,monospace;font-size:16px}.box{fill:#fff;stroke:#b7bdc8;stroke-width:1.5}.edge{fill:none;stroke:#4f5d75;stroke-width:1.5;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="48" y="62" class="title">Shared memory through MCP</text>
<text x="48" y="94" class="small">Three tools. One engine. Original evidence and guarded writes.</text>
<rect x="48" y="138" width="248" height="154" rx="10" class="box"/>
<text x="68" y="172" class="label">Host agents</text>
<text x="68" y="206" class="mono">Claude Code · Codex</text>
<text x="68" y="234" class="mono">Cursor · OpenCode</text>
<text x="68" y="268" class="small">Lead owns meaning + permission</text>
<path d="M296 215H342" class="edge"/>
<rect x="344" y="138" width="266" height="154" rx="10" class="box"/>
<text x="364" y="172" class="label">MCP server</text>
<text x="364" y="210" class="mono">recall · read · remember</text>
<text x="364" y="244" class="small">stdio / authenticated HTTP</text>
<text x="364" y="268" class="small">Resources disclose the protocol</text>
<path d="M610 215H654" class="edge"/>
<rect x="656" y="138" width="240" height="154" rx="10" class="box"/>
<text x="676" y="172" class="label">Shared engine · src/</text>
<text x="676" y="208" class="small">Resident index + lazy local BGE</text>
<text x="676" y="236" class="small">CLI calls the same engine</text>
<text x="676" y="268" class="small">Typed blockers · bounded reads</text>
<path d="M896 215H940" class="edge"/>
<rect x="942" y="138" width="290" height="154" rx="10" class="box"/>
<text x="962" y="172" class="label">Markdown / Obsidian</text>
<text x="962" y="208" class="small">Canonical operational memory</text>
<text x="962" y="236" class="small">Originals + lifecycle + provenance</text>
<text x="962" y="268" class="small">Optional private Git sync</text>
<text x="48" y="336" class="label">Recall pipeline</text>
<rect x="48" y="358" width="204" height="100" rx="8" class="box"/>
<text x="62" y="388" class="mono">Keyword + meaning</text>
<text x="62" y="416" class="small">BM25F + local BGE</text><text x="62" y="440" class="small">Up to 8 fused seeds</text>
<path d="M252 408H282" class="edge"/>
<rect x="284" y="358" width="188" height="100" rx="8" class="box"/>
<text x="298" y="388" class="mono">Authored links</text>
<text x="298" y="416" class="small">≤3 hops / ≤512 visited</text><text x="298" y="440" class="small">Lifecycle eligibility</text>
<path d="M472 408H502" class="edge"/>
<rect x="504" y="358" width="168" height="100" rx="8" class="box"/>
<text x="522" y="388" class="mono">RRF fusion</text>
<text x="522" y="416" class="small">k = 60</text><text x="522" y="440" class="small">Ranked candidates</text>
<path d="M672 408H702" class="edge"/>
<rect x="704" y="358" width="192" height="100" rx="8" class="box"/>
<text x="720" y="388" class="mono">Rerank</text>
<text x="720" y="416" class="small">Margin-gated focus</text><text x="720" y="440" class="small">Opt-in · not promoted</text>
<path d="M896 408H926" class="edge"/>
<rect x="928" y="358" width="304" height="100" rx="8" class="box"/>
<text x="944" y="388" class="label">Curator selects + verifies</text>
<text x="944" y="416" class="small">Reads originals through read</text><text x="944" y="440" class="small">Cited Brief · page if incomplete</text>
<text x="48" y="506" class="label">Guarded write</text>
<rect x="48" y="526" width="1184" height="90" rx="8" class="box"/>
<text x="68" y="562" class="mono">Reviewed Memory Patch → prepare → bound placement → full finish → APPLIED receipt</text>
<text x="68" y="593" class="small">Pending blocks reads · TENSION for conflicts · BLOCKED for missing evidence · authorized supersession preserves history</text>
<text x="48" y="655" class="small">Model, vectors and checkpoints live outside the vault. Source fingerprints invalidate stale summaries.</text>
<text x="48" y="682" class="small">PPR, MMR, margin rerank, context order and abstain floor remain opt-in pending held-out evaluation.</text>
</svg>
