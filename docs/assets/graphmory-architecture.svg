<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="graphmory-architecture-title graphmory-architecture-desc">
      <title id="graphmory-architecture-title">Graphmory read and write architecture</title>
      <desc id="graphmory-architecture-desc">A Codex or OpenCode lead delegates to a host-run Memory Curator. The Curator sends a query or patch to Graphmory CLI, receives candidates and originals, and returns a cited brief. The CLI reads and verifies writes to canonical Markdown, with checkpoint and model caches outside the vault.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="graphmory-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0 0L8 4L0 8Z" fill="#4f5d75"/>
        </marker>
        <marker id="graphmory-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0 0L8 4L0 8Z" fill="#eb6c36"/>
        </marker>
        <marker id="graphmory-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0 0L8 4L0 8Z" fill="#2d3142"/>
        </marker>
        <style>
          .sans { font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; }
          .serif { font-family: "Instrument Serif", Georgia, serif; }
          .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
        </style>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <text x="56" y="60" fill="#4f5d75" font-size="8" font-weight="600" letter-spacing="1.6" class="mono">GRAPHMORY  /  SYSTEM OVERVIEW</text>
      <text x="56" y="100" fill="#2d3142" font-size="28" font-weight="400" class="serif">Graphmory routes recall and writes through one CLI</text>
      <text x="56" y="128" fill="#4f5d75" font-size="12" class="sans">The host lead delegates to a named Memory Curator, then reviews a cited brief or a prepared memory update.</text>

      <!-- Three responsibility zones -->
      <g aria-hidden="true">
        <rect x="40" y="176" width="424" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(79,93,117,0.42)" stroke-width="1" stroke-dasharray="5 4"/>
        <rect x="480" y="176" width="392" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(79,93,117,0.42)" stroke-width="1" stroke-dasharray="5 4"/>
        <rect x="888" y="176" width="352" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(79,93,117,0.42)" stroke-width="1" stroke-dasharray="5 4"/>
        <rect x="56" y="180" width="112" height="20" rx="2" fill="#f5f5f5"/>
        <rect x="496" y="180" width="160" height="20" rx="2" fill="#f5f5f5"/>
        <rect x="904" y="180" width="144" height="20" rx="2" fill="#f5f5f5"/>
        <text x="60" y="196" fill="#4f5d75" font-size="12" font-weight="500" letter-spacing="1.2" class="mono">HOST AGENTS</text>
        <text x="500" y="196" fill="#4f5d75" font-size="12" font-weight="500" letter-spacing="1.2" class="mono">GRAPHMORY CLI</text>
        <text x="908" y="196" fill="#4f5d75" font-size="12" font-weight="500" letter-spacing="1.2" class="mono">SHARED MEMORY</text>
      </g>

      <!-- Separate request / return tracks make both handoffs explicit. -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M208 344H304" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#graphmory-arrow)"/>
        <path d="M304 408H208" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#graphmory-arrow)"/>
        <path d="M456 348H620" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#graphmory-arrow)"/>
        <path d="M620 404H456" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#graphmory-arrow)"/>
        <path d="M952 340H852" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#graphmory-arrow)"/>
        <path d="M852 408H952" stroke="#eb6c36" stroke-width="1.75" marker-end="url(#graphmory-arrow-accent)"/>
        <path d="M852 500H952" stroke="#4f5d75" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#graphmory-arrow)"/>
      </g>

      <!-- Opaque label masks leave visible air around each connector. -->
      <g class="mono" text-anchor="middle" font-size="12" font-weight="500">
        <rect x="220" y="316" width="72" height="20" rx="2" fill="#f5f5f5"/>
        <text x="256" y="332" fill="#4f5d75">delegates</text>

        <rect x="216" y="416" width="80" height="20" rx="2" fill="#f5f5f5"/>
        <text x="256" y="432" fill="#4f5d75">cited Brief</text>

        <rect x="478" y="320" width="120" height="20" rx="2" fill="#f5f5f5"/>
        <text x="538" y="336" fill="#4f5d75">query + patch</text>

        <rect x="458" y="412" width="160" height="20" rx="2" fill="#f5f5f5"/>
        <text x="538" y="428" fill="#4f5d75">candidates + originals</text>

        <rect x="854" y="312" width="96" height="20" rx="2" fill="#f5f5f5"/>
        <text x="902" y="328" fill="#4f5d75">read Markdown</text>

        <rect x="854" y="380" width="96" height="20" rx="2" fill="#f5f5f5"/>
        <text x="902" y="396" fill="#2d3142">guarded write</text>

        <rect x="854" y="472" width="96" height="20" rx="2" fill="#f5f5f5"/>
        <text x="902" y="488" fill="#4f5d75">state access</text>
      </g>

      <!-- Host and lead share one responsibility node. -->
      <g class="sans" text-anchor="middle">
        <rect x="64" y="304" width="144" height="144" rx="8" fill="rgba(79,93,117,0.08)" stroke="#4f5d75" stroke-width="1.25"/>
        <text x="136" y="340" fill="#2d3142" font-size="16" font-weight="600">Coding agents</text>
        <text x="136" y="372" fill="#2d3142" font-size="16" font-weight="600">Lead agent</text>
        <text x="136" y="408" fill="#4f5d75" font-size="12">owns the answer</text>

        <rect x="304" y="304" width="152" height="144" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.56" stroke-width="1.25"/>
        <text x="380" y="328" fill="#4f5d75" font-size="8" font-weight="600" letter-spacing="1.2" class="mono">NAMED AGENT</text>
        <text x="380" y="356" fill="#2d3142" font-size="16" font-weight="600">Memory Curator</text>
        <text x="380" y="384" fill="#4f5d75" font-size="12">host LLM</text>
        <text x="380" y="408" fill="#4f5d75" font-size="12">not run locally</text>
        <text x="380" y="432" fill="#4f5d75" font-size="12">curates cited evidence</text>
      </g>

      <!-- CLI owns retrieval and guarded finish checks; the Curator authors prose. -->
      <g class="sans" text-anchor="middle">
        <rect x="620" y="220" width="232" height="324" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
        <text x="736" y="256" fill="#2d3142" font-size="16" font-weight="600">Graphmory CLI</text>
        <text x="736" y="280" fill="#4f5d75" font-size="12">search + guarded finish</text>
        <path d="M644 296H828" stroke="rgba(79,93,117,0.32)" stroke-width="1"/>

        <text x="652" y="324" text-anchor="start" fill="#4f5d75" font-size="12" font-weight="600" letter-spacing="1.2" class="mono">READ</text>
        <text x="652" y="352" text-anchor="start" fill="#2d3142" font-size="12">keywords + semantic</text>
        <text x="652" y="376" text-anchor="start" fill="#2d3142" font-size="12">authored graph · RRF</text>
        <path d="M644 392H828" stroke="rgba(79,93,117,0.32)" stroke-width="1"/>

        <text x="652" y="420" text-anchor="start" fill="#2d3142" font-size="12" font-weight="600" letter-spacing="1.2" class="mono">WRITE</text>
        <text x="652" y="444" text-anchor="start" fill="#2d3142" font-size="12">prepare before edit</text>
        <text x="652" y="464" text-anchor="start" fill="#2d3142" font-size="12">full finish checks</text>
        <text x="652" y="484" text-anchor="start" fill="#2d3142" font-size="12">pending blocks CLI content</text>
        <text x="652" y="504" text-anchor="start" fill="#2d3142" font-size="12">lifecycle checks → receipt</text>
        <text x="652" y="528" text-anchor="start" fill="#4f5d75" font-size="12">Curator edits · CLI verifies</text>
      </g>

      <!-- Canonical Markdown and outside-vault shared state stay distinct. -->
      <g class="sans" text-anchor="middle">
        <rect x="952" y="220" width="256" height="224" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.25"/>
        <text x="1080" y="264" fill="#2d3142" font-size="16" font-weight="600">Obsidian / Markdown</text>
        <text x="1080" y="288" fill="#4f5d75" font-size="12">canonical memory</text>
        <path d="M980 308H1180" stroke="rgba(79,93,117,0.32)" stroke-width="1"/>
        <text x="1080" y="336" fill="#2d3142" font-size="12">whole notes + authored links</text>
        <text x="1080" y="368" fill="#4f5d75" font-size="12">changed source fingerprints</text>
        <text x="1080" y="392" fill="#4f5d75" font-size="12">invalidate summaries</text>

        <rect x="952" y="460" width="256" height="84" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.25"/>
        <text x="1080" y="492" fill="#2d3142" font-size="16" font-weight="600">Shared outside-vault state</text>
        <text x="1080" y="520" fill="#4f5d75" font-size="12">checkpoint · local model · vectors</text>
      </g>

      <text x="56" y="584" fill="#2d3142" font-size="12" class="sans">Changed source fingerprints invalidate summaries. Receipts verify saved structure; agent judgment establishes meaning.</text>
      <text x="56" y="604" fill="#4f5d75" font-size="12" class="sans">Curator continues until evidence is sufficient; no fixed total note cap. Native file tools sit outside CLI guards. Offline fallbacks: Georgia, system UI and monospace.</text>

      <!-- Horizontal legend strip -->
      <path d="M40 620H1240" stroke="rgba(79,93,117,0.34)" stroke-width="1"/>
      <g class="sans" font-size="12">
        <path d="M60 652H108" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#graphmory-arrow)"/>
        <text x="128" y="656" fill="#2d3142">READ · cited candidates + originals</text>

        <path d="M480 652H528" fill="none" stroke="#eb6c36" stroke-width="1.75" marker-end="url(#graphmory-arrow-accent)"/>
        <text x="548" y="656" fill="#2d3142">WRITE · prepare, finish checks, receipt</text>

        <path d="M900 652H948" fill="none" stroke="#4f5d75" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#graphmory-arrow)"/>
        <text x="968" y="656" fill="#2d3142">STATE · checkpoint + local model / vectors</text>
      </g>
    </svg>
