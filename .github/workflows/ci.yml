name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --package-lock=false
      - run: npm run check
      - run: npm pack --dry-run

  install-smoke:
    name: Install Smoke Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --ignore-scripts --package-lock=false
      - run: node --test test/fresh-install.test.mjs
      - name: Direct install smoke (file-copy installer)
        shell: bash
        run: |
          TARGET=$(mktemp -d)
          node scripts/install.mjs --target "$TARGET" --force
          test -f "$TARGET/skills/memory-curator/SKILL.md" || { echo "Missing skill"; exit 1; }
          test -f "$TARGET/src/brain-sync.mjs" || { echo "Missing src"; exit 1; }
          test -f "$TARGET/bin/memory-patch-harness.mjs" || { echo "Missing CLI"; exit 1; }
          node "$TARGET/bin/memory-patch-harness.mjs" doctor --json || { echo "doctor failed"; exit 1; }
          rm -rf "$TARGET"
